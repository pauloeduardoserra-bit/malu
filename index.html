<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar Ateliê Malu</title>
<style>
  body { font-family: sans-serif; background: #f5f4f0; padding: 24px 16px; max-width: 430px; margin: 0 auto; }
  h2 { color: #3C3489; margin-bottom: 8px; }
  p { color: #555; font-size: 14px; line-height: 1.5; margin-bottom: 16px; }
  .card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid #eee; }
  button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; margin-bottom: 10px; }
  .btn-roxo { background: #3C3489; color: white; }
  .btn-laranja { background: #D85A30; color: white; }
  .btn-verde { background: #0F6E56; color: white; }
  .btn-cinza { background: #eee; color: #333; }
  #status { font-size: 13px; color: #333; background: #eee; border-radius: 8px; padding: 10px 12px; min-height: 40px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h2>🛠️ Recuperação</h2>
<p>Use esta página para destravar o app. Execute na ordem:</p>

<div class="card">
  <p><strong>Passo 1</strong> — Exportar os dados antes de limpar</p>
  <button class="btn-roxo" onclick="exportar()">📦 Exportar backup agora</button>
</div>

<div class="card">
  <p><strong>Passo 2</strong> — Limpar o armazenamento lotado</p>
  <button class="btn-laranja" onclick="limpar()">🧹 Limpar localStorage</button>
</div>

<div class="card">
  <p><strong>Passo 3</strong> — Verificar quantos dados existem</p>
  <button class="btn-cinza" onclick="verificar()">🔍 Ver o que está salvo</button>
</div>

<div id="status">Aguardando...</div>

<script>
function verificar() {
  const el = document.getElementById('status');
  try {
    const raw = localStorage.getItem('maluDB');
    if (!raw) { el.textContent = '⚠️ Nenhum dado encontrado no localStorage.'; return; }
    const db = JSON.parse(raw);
    const nAlunas = db.alunas?.length || 0;
    const nRegs = db.registros?.length || 0;
    const fotos = db.registros?.filter(r => r.foto && r.foto.length > 100).length || 0;
    const tamanhoKB = Math.round(raw.length / 1024);
    el.textContent = `✅ Dados encontrados:\n- ${nAlunas} alunas\n- ${nRegs} registros\n- ${fotos} fotos em base64 (ocupando espaço)\n- Tamanho total: ${tamanhoKB} KB`;
  } catch(e) {
    el.textContent = '❌ Erro ao ler dados: ' + e.message;
  }
}

function exportar() {
  const el = document.getElementById('status');
  try {
    const raw = localStorage.getItem('maluDB');
    if (!raw) { el.textContent = '⚠️ Nenhum dado para exportar.'; return; }
    const db = JSON.parse(raw);
    // Remove fotos base64 do backup para reduzir tamanho
    const dbLimpo = JSON.parse(JSON.stringify(db));
    dbLimpo.registros.forEach(r => { if (r.foto) { r.temFoto = true; r.foto = null; } });
    const json = JSON.stringify(dbLimpo, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const agora = new Date();
    const stamp = agora.getFullYear() + '-' + String(agora.getMonth()+1).padStart(2,'0') + '-' + String(agora.getDate()).padStart(2,'0');
    const file = new File([blob], `malu-backup-${stamp}.json`, { type: 'application/json' });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Backup Ateliê Malu Serra' })
        .then(() => el.textContent = '✅ Backup exportado! Agora execute o Passo 2.')
        .catch(e => { if (e.name !== 'AbortError') baixar(blob, file.name); });
    } else {
      baixar(blob, file.name);
    }
  } catch(e) {
    el.textContent = '❌ Erro ao exportar: ' + e.message;
  }
}

function baixar(blob, nome) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  document.getElementById('status').textContent = '✅ Backup baixado! Agora execute o Passo 2.';
}

function limpar() {
  if (!confirm('Tem certeza? Isso apaga tudo do localStorage.\nSó faça isso DEPOIS de exportar o backup!')) return;
  const el = document.getElementById('status');
  try {
    localStorage.clear();
    el.textContent = '✅ localStorage limpo!\n\nAgora:\n1. Delete o app da tela de início\n2. Reinstale pelo Safari\n3. Importe o backup em Configurações';
  } catch(e) {
    el.textContent = '❌ Erro ao limpar: ' + e.message;
  }
}

// Verifica automaticamente ao abrir
verificar();
</script>
</body>
</html>
